<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>match.build</title>

    <!-- Installable to the home screen (prd/phase-1.md §8.2), which is the
         only way iOS delivers web push at all. Relative hrefs, because the app
         is served under a base path (/app/). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="match.build" />
    <meta name="theme-color" content="#8f2239" />
    <script>
      // Before first paint: a stored theme choice, applied as the class the
      // tokens key off (src/theme/theme.ts). Without this, a dark-theme user
      // gets a flash of the light palette on every load.
      var stored = null;
      try {
        stored = localStorage.getItem("matchmaker-theme");
      } catch {
        // Blocked storage: fall back to following the device.
      }
      if (stored === "dark" || stored === "light") {
        document.documentElement.classList.add(stored);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
