<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="match.build">
  <title>match.build</title>
  <!-- Two circles, and the ground they share: the match. Drawn once, at one
       size, so every icon in the repo is this file scaled. -->
  <defs>
    <clipPath id="overlap"><circle cx="21.5" cy="32" r="16" /></clipPath>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="5">
    <circle cx="21.5" cy="32" r="16" />
    <circle cx="42.5" cy="32" r="16" />
  </g>
  <circle cx="42.5" cy="32" r="16" fill="currentColor" clip-path="url(#overlap)" />
</svg>
